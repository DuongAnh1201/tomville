# Release to PyPI: push a tag like v0.1.0 whose number matches pyproject.toml.
# Run it by hand (Actions → Release → Run workflow) to upload to TestPyPI instead.
# Uses PyPI trusted publishing: no token is stored; see RELEASING.md for the one-time setup.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tests
        run: uv run pytest -q -o faulthandler_timeout=120
      - name: Build, install and run the wheel
        run: |
          uv build
          uv venv /tmp/check
          uv pip install --python /tmp/check dist/*.whl
          /tmp/check/bin/tmv --version
          cd "$RUNNER_TEMP" && /tmp/check/bin/tmv --demo status --json > /dev/null

  build:
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tests
        run: uv run pytest -q -o faulthandler_timeout=120
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1; }
      - name: Build
        run: uv build
      - name: Install the wheel and run it
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check dist/*.whl
          /tmp/check/bin/tmv --version
          /tmp/check/bin/tmv --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tomville
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tomville
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
