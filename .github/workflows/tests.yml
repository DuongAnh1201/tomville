# Tests on every push and pull request, on Ubuntu and macOS.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: uv run pytest -q -o faulthandler_timeout=120
      - name: Build, install and run the wheel
        run: |
          uv build
          uv venv /tmp/check
          uv pip install --python /tmp/check dist/*.whl
          /tmp/check/bin/tmv --version
          cd "$RUNNER_TEMP" && /tmp/check/bin/tmv --demo status --json > /dev/null
