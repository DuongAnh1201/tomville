[project]
name = "tomville"
version = "0.1.0"
description = "A retro game view of your agent team, built on top of herdr"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tom Nguyen", email = "tomnguyen6766@gmail.com" }]
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
tomville = "tomville.cli:main"
tmv = "tomville.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tomville"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
